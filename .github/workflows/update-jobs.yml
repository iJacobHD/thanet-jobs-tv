name: Update Thanet jobs

# Every morning: fetch jobs from Reed's official API (needs the REED_API_KEY secret),
# filter them, and remake the TV board, the slides and "Jobs this week.mp4".
on:
  schedule:
    - cron: "17 5 * * *"     # main morning run
    - cron: "43 7 * * *"     # backup: only does anything if GitHub skipped the 05:17 run (it sometimes does)
  workflow_dispatch:
    inputs:
      only_if_needed:
        description: "Skip if today's update already ran (used by the morning scheduled task)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"      # show progress in the log while it runs
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4

      # GitHub's timer can fire hours late. Any timed run - and any run started by the morning
      # scheduled task - does nothing if today's update has already happened (protects the Reed limit).
      # Pressing "Run workflow" by hand on the GitHub page always runs.
      - name: Already updated today?
        if: github.event_name == 'schedule' || inputs.only_if_needed == true
        run: |
          made=$(python3 -c "import json;print(json.load(open('docs/jobs.json'))['generated'][:10])")
          if [ "$made" = "$(date -u +%F)" ]; then
            echo "Today's update has already run - nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"

      - name: Install
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt playwright pillow
          python -m playwright install --with-deps chromium

      - name: Fetch and filter jobs (Reed, Teaching Vacancies, NHS Jobs, Adzuna)
        if: env.SKIP != '1'
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          FAA_API_KEY: ${{ secrets.FAA_API_KEY }}
        run: python scripts/update_jobs.py

      - name: Make slides and MP4
        if: env.SKIP != '1'
        run: python scripts/render_slides.py

      - name: Save changes
        if: env.SKIP != '1'
        run: |
          git config user.name  "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add -A docs data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase -X theirs || true
            git push
          fi

      # Discovery also runs straight after the update, so new employers keep being found even when
      # GitHub's 01:31 timer doesn't fire. It skips if it already ran today and is capped at 20 minutes.
      - name: Discover more employers
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          DISCOVERY_MINUTES: "20"
        run: |
          done=$(python3 -c "import json;print(json.load(open('docs/sources.json')).get('checked',''))" 2>/dev/null || true)
          if [ "$done" = "$(date -u +%F)" ]; then echo "Discovery already ran today"; exit 0; fi
          python scripts/discover.py
          git add -A data/discovery.json data/auto_employers.json docs/sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Discovery $(date -u +'%Y-%m-%d')"
            git pull --rebase -X theirs || true
            git push
          fi
