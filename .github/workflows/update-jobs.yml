name: Update Thanet jobs

# Every morning: fetch jobs from Reed's official API (needs the REED_API_KEY secret),
# filter them, and remake the TV board, the slides and "Jobs this week.mp4".
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt playwright pillow
          python -m playwright install --with-deps chromium

      - name: Fetch and filter jobs (Reed)
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: |
          if [ -n "$REED_API_KEY" ]; then
            python scripts/update_jobs.py
          else
            echo "::warning::No REED_API_KEY secret yet - remaking the video from the last job list."
          fi

      - name: Make slides and MP4
        run: python scripts/render_slides.py

      - name: Save changes
        run: |
          git config user.name  "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add -A docs data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
