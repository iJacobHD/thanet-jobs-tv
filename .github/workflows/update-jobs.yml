name: Update Thanet jobs

# Work Hub blocks GitHub's servers, so jobs are collected by a person on Work Hub
# (the "Collect Thanet jobs" bookmark) and the file is uploaded to the incoming/ folder.
# That upload starts this workflow. It also runs every morning to rebuild the USB
# slides, so jobs that are about to close drop off them.
on:
  push:
    paths:
      - "incoming/**.json"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt playwright pillow
          python -m playwright install --with-deps chromium

      - name: Process uploaded job file
        run: |
          f=$(ls incoming/*.json 2>/dev/null | sort | tail -n 1)
          if [ -n "$f" ]; then
            echo "Processing $f"
            python scripts/update_jobs.py --from-dump "$f"
            git rm -q incoming/*.json
          else
            echo "No new upload - just rebuilding slides"
          fi

      - name: Make USB slides (JPG)
        run: python scripts/render_slides.py

      - name: Save changes
        run: |
          git config user.name  "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add -A docs data incoming
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
