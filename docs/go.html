<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2040%2040%22%20aria-hidden%3D%22true%22%3E%3Crect%20rx%3D%2210%22%20fill%3D%22%23ffdd00%22/%3E%3Cpath%20d%3D%22M20%2024.5s7-6.1%207-11a7%207%200%200%200-14%200c0%204.9%207%2011%207%2011z%22%20fill%3D%22none%22%20stroke%3D%22%230b2a4a%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2213.5%22%20r%3D%222.7%22%20fill%3D%22%230b2a4a%22/%3E%3Cpath%20d%3D%22M9%2030.5q2.75-2.6%205.5%200t5.5%200%205.5%200%205.5%200%22%20fill%3D%22none%22%20stroke%3D%22%230b2a4a%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<title>Job details</title>
<style>
  :root{--navy:#0b2a4a;--ink:#0b0c0c;--muted:#505a5f;--yellow:#ffdd00;--green:#00703c;--line:#d8dde3}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#f3f5f7;font-size:18px;line-height:1.4}
  header{background:var(--navy);color:#fff;padding:14px 20px;font-weight:700;font-size:15px;letter-spacing:.03em}
  header .brand{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:500;font-size:18px;letter-spacing:-.01em}
  header .brand b{font-weight:800}
  main{max-width:560px;margin:0 auto;padding:20px}
  h1{font-size:28px;line-height:1.15;margin:4px 0 6px}
  .emp{color:var(--muted);font-size:19px;margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:700;font-size:16px}
  .chip.pay{background:#e6f4ea;border-color:#c5e5cf;color:#0b4f2a}
  .closes{font-weight:700;margin-bottom:22px}
  .closes.soon{color:#b42318}
  a.btn{display:flex;align-items:center;gap:14px;text-decoration:none;border-radius:14px;padding:18px 20px;margin-bottom:14px;font-weight:800;font-size:21px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  a.btn small{display:block;font-weight:500;font-size:15px;opacity:.9;margin-top:2px}
  a.btn .ic{font-size:30px;line-height:1}
  .apply{background:var(--green);color:#fff}
  .route{background:#fff;color:var(--navy);border:3px solid var(--navy)}
  .note{font-size:15px;color:var(--muted);margin-top:18px}
  .missing{background:#fff;border-left:8px solid var(--yellow);padding:16px 18px;border-radius:8px}
  .i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  a.btn .ic .i{width:28px;height:28px}
</style>
</head>
<body>
<header><a href="./" class="brand"><svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#ffdd00"/><path d="M20 24.5s7-6.1 7-11a7 7 0 0 0-14 0c0 4.9 7 11 7 11z" fill="none" stroke="#0b2a4a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="13.5" r="2.7" fill="#0b2a4a"/><path d="M9 30.5q2.75-2.6 5.5 0t5.5 0 5.5 0 5.5 0" fill="none" stroke="#0b2a4a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>East Kent <b>Jobs</b></span></a></header>
<main id="m"><p>Loading…</p></main>
<script>
(async () => {
  const m = document.getElementById("m");
  const id = new URLSearchParams(location.search).get("j") || "";
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let j = null;
  try { j = (await (await fetch("go.json", { cache: "no-store" })).json())[id]; } catch (e) {}
  if (!j) {
    m.innerHTML = `<div class="missing"><h1>This job has closed</h1>
      <p>It is no longer on our board. Have a look at what is open now, or ask a member of staff.</p></div>
      <a class="btn apply" href="./"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span><span>See today's jobs</span></a>`;
    return;
  }
  document.title = j.t;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const close = new Date(j.closing + "T00:00:00");
  const left = Math.round((close - today) / 864e5);
  const nice = close.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const closes = j.est ? "No closing date given – apply soon"
    : left < 0 ? "This advert may have closed – check before applying"
    : left <= 3 ? `Closes soon: ${nice}` : `Apply by ${nice}`;
  const where = /\b(?:kent|uk)\b/i.test(j.place) ? j.place : j.place + ", Kent";
  const maps = "https://www.google.com/maps/dir/?api=1&travelmode=transit&destination=" + encodeURIComponent(where);
  m.innerHTML = `
    <h1>${esc(j.t)}</h1>
    <div class="emp">${esc(j.e)}</div>
    <div class="chips">
      <span class="chip"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg> ${esc(j.town)}</span>
      <span class="chip pay">${esc(j.pay)}</span>
      ${j.hours ? `<span class="chip">${esc(j.hours)}</span>` : ""}
    </div>
    <div class="closes ${left <= 3 && !j.est ? "soon" : ""}">${closes}</div>
    <a class="btn apply" href="${esc(j.url)}"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg></span><span>Read the advert and apply<small>Opens the employer's or job site's page</small></span></a>
    <a class="btn route" href="${esc(maps)}"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="2.5"/><path d="M4 11h16M7.5 18v3M16.5 18v3"/><path d="M8 14.5h.01M16 14.5h.01" stroke-width="3"/></svg></span><span>How do I get there?<small>Bus and train route from where you are now</small></span></a>
    <p class="note">The route goes to ${esc(j.town)}. The advert has the exact address – for agency jobs it may be a different site. Need help? Ask a member of staff.</p>
    ${j.src === "Adzuna" ? `<p class="note"><a href="https://www.adzuna.co.uk" target="_blank" rel="noopener" style="display:inline-block;min-width:116px;min-height:23px;line-height:23px;font-weight:700;text-decoration:none;color:inherit">Jobs by <span style="color:#7cb342">Adzuna</span></a></p>` : ""}
    <p class="note">Thinking about a different kind of work? <a href="pathway/">Find your pathway →</a></p>`;
})();
</script>
</body>
</html>
