<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2040%2040%22%20aria-hidden%3D%22true%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2210%22%20fill%3D%22%23a4c639%22/%3E%3Cpath%20d%3D%22M10%2031c0-6%205-7%2010-7s10-2%2010-7-4-6-8-6%22%20fill%3D%22none%22%20stroke%3D%22%230b2a4a%22%20stroke-width%3D%223.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2213.5%22%20cy%3D%2211%22%20r%3D%223.6%22%20fill%3D%22%230b2a4a%22/%3E%3C/svg%3E">
<title>Pathway – find your way into a new sector | East Kent Jobs</title>
<meta name="description" content="Upload your CV or tick what you have done, and see which job sectors you could move into in East Kent – and how.">
<style>
  :root{--navy:#0b2a4a;--navy2:#123b63;--ink:#0b0c0c;--muted:#505a5f;--yellow:#ffdd00;--lime:#a4c639;--green:#00703c;--line:#d8dde3;--bg:#f3f5f7;--warn:#b42318}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:18px;line-height:1.45}
  a{color:#1d4f91}
  header.top{background:var(--navy);color:#fff}
  header.top .in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.top a{color:#fff;text-decoration:none;font-weight:700}
  header.top .brand{display:inline-flex;align-items:center;gap:11px}
  header.top .brand svg{flex:0 0 auto}
  header.top .bw{display:flex;flex-direction:column;gap:3px;line-height:1}
  header.top .bn{font-size:21px;font-weight:800;letter-spacing:-.01em}
  header.top .bs{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
  header.top .tag{background:var(--yellow);color:var(--ink);padding:2px 8px;border-radius:4px;font-size:14px;letter-spacing:.04em}
  header.top nav{margin-left:auto;display:flex;gap:16px;font-size:16px}
  header.top nav a{font-weight:600;opacity:.9}
  main{max-width:1040px;margin:0 auto;padding:22px 24px 60px}
  .hero{background:var(--navy);color:#fff;border-radius:18px;padding:28px 26px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-60px;top:0;bottom:0;width:220px;background:linear-gradient(115deg,transparent 0 30%,var(--navy2) 30% 55%,var(--lime) 55% 62%,transparent 62%)}
  .hero h1{font-size:38px;line-height:1.05;margin:0 0 6px;position:relative;z-index:1;max-width:560px}
  .hero h1 span{color:var(--lime)}
  .hero p{margin:0;font-size:19px;opacity:.95;position:relative;z-index:1;max-width:520px}
  h2{font-size:26px;margin:30px 0 10px;line-height:1.15}
  h3{font-size:20px;margin:0 0 6px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  @media (max-width:640px){.choices{grid-template-columns:1fr}.hero h1{font-size:31px}}
  .choice{background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block;text-decoration:none}
  .choice:hover,.choice:focus{border-color:var(--navy);outline:none}
  .choice .ic{font-size:34px;display:block;margin-bottom:6px}
  .choice b{font-size:21px;display:block}
  .choice small{color:var(--muted);font-size:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}
  .privacy{display:flex;gap:10px;align-items:flex-start;background:#e8f4ec;border:1px solid #bfe0c9;border-radius:12px;padding:12px 14px;font-size:16px;margin:14px 0}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:12px;padding:14px 20px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
  .btn.small{padding:9px 14px;font-size:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:230px;border:3px dashed #9fb0c2;border-radius:16px;padding:28px 20px;text-align:center;background:#fafbfc;cursor:pointer;transition:border-color .15s,background .15s}
  .drop:hover{border-color:var(--navy);background:#f3f6fa}
  .drop .big{font-size:46px;line-height:1}
  .drop b{font-size:21px}
  .touch{display:none}
  @media (hover:none){.desk{display:none}.touch{display:inline}}
  .drop .fake{margin-top:8px;pointer-events:none}
  .drop.over{border-color:var(--green);background:#f1faf4}
  .drop input{display:none}
  textarea{width:100%;min-height:140px;font:inherit;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip.on-static{background:#e6f4ea;border-color:#c5e5cf;color:#0b4f2a;cursor:default}
  .chip.gap{background:#fff4d6;border-color:#f1d78a;color:#5c4400;cursor:default}
  .jobs-tick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
  .jobs-tick label{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:17px}
  .jobs-tick input{width:22px;height:22px;accent-color:var(--navy)}
  .jobs-tick label:has(input:checked){border-color:var(--navy);background:#eef3f9}
  .match{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;text-decoration:none;color:inherit}
  .match:hover{border-color:var(--navy)}
  .match .ic{font-size:30px;width:42px;text-align:center}
  .match .body{flex:1;min-width:0}
  .match b{font-size:19px}
  .meter{height:10px;background:#e3e8ee;border-radius:99px;overflow:hidden;margin:6px 0 4px}
  .meter i{display:block;height:100%;background:var(--lime)}
  .match small{color:var(--muted);font-size:15px}
  .go{font-weight:800;color:var(--navy);white-space:nowrap}
  .badge{display:inline-block;font-size:13px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--yellow);color:var(--ink);vertical-align:middle;margin-left:6px;letter-spacing:.03em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;display:flex;gap:10px;align-items:center;font-weight:700}
  .tile:hover{border-color:var(--navy)}
  .tile .ic{font-size:26px}
  .tile.soon{opacity:.75;font-weight:600}
  .sector-head{display:flex;gap:16px;align-items:center;background:var(--navy);color:#fff;border-radius:18px;padding:22px 24px}
  .sector-head .ic{font-size:48px}
  .sector-head h1{margin:0;font-size:34px;line-height:1.05}
  .sector-head p{margin:4px 0 0;opacity:.9}
  .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (max-width:640px){.facts{grid-template-columns:1fr}}
  .fact{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .fact h3{display:flex;gap:10px;align-items:center;font-size:18px}
  .fact h3 .ic{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 38px}
  ul{padding-left:22px;margin:6px 0}
  li{margin:3px 0}
  ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
  ol.steps li{counter-increment:s;position:relative;padding:14px 14px 14px 62px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:10px 0}
  ol.steps li:before{content:counter(s);position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--navy);font-weight:900;display:flex;align-items:center;justify-content:center}
  ol.steps b{display:block;font-size:18px}
  .bridge{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){.bridge{grid-template-columns:1fr}}
  .bridge .col{background:#fff;border-radius:14px;padding:16px;border:1px solid var(--line)}
  .bridge .have{border-top:6px solid var(--green)}
  .bridge .need{border-top:6px solid var(--yellow)}
  .gapitem{margin:10px 0}
  .gapitem b{display:block}
  .gapitem span{color:var(--muted);font-size:16px}
  .livejobs a.j{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;text-decoration:none;color:inherit}
  .livejobs a.j b{display:block}
  .livejobs a.j small{color:var(--muted)}
  .muted{color:var(--muted)}
  .note{font-size:15px;color:var(--muted)}
  .back{display:inline-block;margin-bottom:12px;font-weight:700;text-decoration:none}
  .status{font-weight:700;margin-top:10px}
  .status.err{color:var(--warn)}
  /* page furniture shared by every step */
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .pagehead h1{font-size:32px;line-height:1.1;margin:4px 0 0}
  .pagehead p{margin:6px 0 0;color:var(--muted)}
  .stepper{display:flex;gap:0;list-style:none;padding:0;margin:0 0 18px;counter-reset:st;background:#fff;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:15px;font-weight:700}
  .stepper li{flex:1;counter-increment:st;padding:10px 14px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap;border-right:1px solid var(--line)}
  .stepper li:last-child{border-right:0}
  .stepper li:before{content:counter(st);width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 24px}
  .stepper li.done{color:var(--green)}
  .stepper li.done:before{content:"✓";background:var(--green);border-color:var(--green);color:#fff}
  .stepper li.now{color:#fff;background:var(--navy)}
  .stepper li.now:before{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
  .stepper a{color:inherit;text-decoration:none}
  @media (max-width:640px){.stepper li{padding:9px 10px}.stepper li span{display:none}.stepper li.now span{display:inline}}
  .two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
  .side{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
  .sector-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start}
  .sticky{position:sticky;top:18px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
  .panel h2,.panel h3{margin-top:0}
  .howto{list-style:none;padding:0;margin:0;counter-reset:h}
  .howto li{counter-increment:h;display:flex;gap:12px;margin:0 0 14px;font-size:16px}
  .howto li:before{content:counter(h);flex:0 0 30px;height:30px;border-radius:50%;background:#eef3f9;color:var(--navy);font-weight:900;display:flex;align-items:center;justify-content:center}
  .howto b{display:block;font-size:17px}
  .searchbar input{flex:1;min-width:0;font:inherit;padding:13px 14px;border:2px solid var(--navy);border-radius:12px}
  .searchbar input:focus,#fq:focus{outline:3px solid var(--yellow);outline-offset:1px}
  .filters{display:grid;grid-template-columns:1.6fr 1.3fr 1.1fr 1.1fr;gap:14px 16px;align-items:end}
  .filters .lvl{grid-column:1/-1;display:flex;align-items:center;gap:12px}
  .filters .lvl .chips{margin:0!important}
  .filters select,.filters input{height:46px}
  @media (max-width:900px){.filters{grid-template-columns:1fr 1fr}}
  @media (max-width:560px){.filters{grid-template-columns:1fr}.filters .lvl{flex-wrap:wrap}}
  .listtools{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 8px;font-size:15px;font-weight:700}
  .listtools select{font:inherit;font-weight:500;padding:7px 10px;border:2px solid var(--line);border-radius:10px;margin-left:6px;background:#fff}
  .lb-more{margin-top:8px}
  .toc{font-size:15px}
  .toc b{display:block;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:13px}
  .toc a{display:block;padding:7px 10px;border-left:3px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600}
  .toc a:hover{border-left-color:var(--navy);background:#fff}
  section[id]{scroll-margin-top:16px}
  .actionbar{position:sticky;bottom:0;background:rgba(243,245,247,.96);backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:12px 0;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700;margin:16px 0;font-size:15px}
  .divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
  @media (max-width:900px){.two,.side,.sector-layout{grid-template-columns:1fr}.sticky{position:static}.toc{display:none}}
  footer.site{max-width:1040px;margin:0 auto;padding:0 20px 40px;font-size:15px;color:var(--muted)}
  @media print{header.top,.noprint,footer.site{display:none!important}body{background:#fff;font-size:13px}.card,.fact,.bridge .col,ol.steps li{break-inside:avoid}.sector-head,.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  .i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .choice .ic{display:inline-flex;width:52px;height:52px;border-radius:14px;background:#eef3f9;color:var(--navy);align-items:center;justify-content:center;margin-bottom:10px}
  .choice .ic .i{width:28px;height:28px}
  .tile{border-left:5px solid var(--lime);flex-direction:column;align-items:flex-start;gap:2px;min-height:74px;justify-content:center}
  .tile .fold{font-size:12.5px;color:var(--muted);font-weight:500}
  .tile .ct{font-size:14px;font-weight:600;color:var(--muted)}
  .tile:hover{border-left-color:var(--navy)}
  .match{border-left:5px solid var(--lime)}
  .drop .big .i{width:46px;height:46px;color:var(--navy);stroke-width:1.6}
  .fact h3 .ic .i{width:20px;height:20px}
  .colhead{display:flex;align-items:center;gap:8px}
  .privacy .i{color:var(--green);width:22px;height:22px;margin-top:1px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a href="#" class="brand" aria-label="Pathway home"><svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#a4c639"/><path d="M10 31c0-6 5-7 10-7s10-2 10-7-4-6-8-6" fill="none" stroke="#0b2a4a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="13.5" cy="11" r="3.6" fill="#0b2a4a"/></svg><span class="bn">Pathway</span></a>
  <nav><a href="#">Start</a><a href="#sectors">All sectors</a><a href="#alljobs">All jobs</a><a href="../">Jobs board</a></nav>
</div></header>
<main id="app"><p>Loading…</p></main>
<footer class="site">Pathway gives general guidance for East Kent. Courses, funding and pay change, so always check with your work coach before paying for anything. Live jobs come from the <a href="../">East Kent Jobs board</a>.<span id="adzcredit" hidden> <a href="https://www.adzuna.co.uk" target="_blank" rel="noopener" style="display:inline-block;min-width:116px;min-height:23px;line-height:23px;font-weight:700;text-decoration:none;color:inherit">Jobs by <span style="color:#7cb342">Adzuna</span></a></span></footer>

<script src="data.js"></script>
<script>
(() => {
  const P = window.PATHWAY, app = document.getElementById("app");
  const S = id => P.SECTORS.find(s => s.id === id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // the person's skills live only in this page (and the address bar), never saved or sent anywhere
  let mine = new Set();
  let board = null;   // live jobs from the main site, loaded once
  let adding = false; // keep "add a skill" open while tapping

  const loadBoard = () => board || (board = Promise.all(["../jobs.json", "../apprenticeships.json", "../careers.json"].map(u =>
    fetch(u, { cache: "no-store" }).then(r => r.json()).then(d => d.jobs || []).catch(() => [])))
    .then(([jobs, apps, careers]) => {
      if ([...jobs, ...apps, ...careers].some(j => j.source === "Adzuna")) document.getElementById("adzcredit").hidden = false;
      return { jobs, apps, careers };
    }));
  // yearly pay from "£12.71/hr", "£24,000–£28,000/yr", "£90/day" (full-time equivalent, for comparing levels)
  const yearly = pay => {
    const m = String(pay).match(/£([\d,.]+)(?:–£([\d,.]+))?\/(hr|yr|day)/); if (!m) return 0;
    const v = parseFloat(m[1].replace(/,/g, "")); return m[3] === "hr" ? v * 37.5 * 52 : m[3] === "day" ? v * 5 * 52 : v;
  };
  const k = n => "£" + (Math.round(n / 500) * 500).toLocaleString("en-GB");
  // a job belongs to a sector if its title has one of the sector's words and none of its "not" words
  // Words match from the start of a word ("manufactur" finds "manufacturing"); short words (4 letters or
  // fewer, like "sen" or "bar") must be the whole word, so "sen" never matches "representative".
  const wordRe = {};
  const has = (t, w) => (wordRe[w] || (wordRe[w] = new RegExp("(^|[^a-z])" + w.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + (w.trim().length <= 4 ? "($|[^a-z])" : ""), "i"))).test(t);
  const byTitle = (s, t) => s.jobwords.some(w => has(t, w)) && !(s.notwords || []).some(w => has(t, w));
  const sectorCache = new WeakMap();
  const sectorsOf = j => {      // by job title first; if the title says nothing about the work, by employer
    if (sectorCache.has(j)) return sectorCache.get(j);
    const t = j.title.toLowerCase(), e = (j.employer || "").toLowerCase();
    let ids = P.SECTORS.filter(s => byTitle(s, t)).map(s => s.id);
    if (!ids.length) ids = Object.entries(P.EMPLOYER_SECTOR || {}).filter(([, names]) => names.some(n => e.includes(n))).map(([id]) => id).slice(0, 1);
    sectorCache.set(j, ids); return ids;
  };
  const inSector = (s, j) => sectorsOf(j).includes(s.id);
  const sectorOf = j => P.SECTORS.find(s => inSector(s, j));

  // ---------------------------------------------------------------- reading a CV on the device
  const norm = t => " " + t.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9&+'#\-]+/g, " ") + " ";
  function skillsFromText(text) {
    const t = norm(text), found = new Set();
    for (const [id, sk] of Object.entries(P.SKILLS))
      if (sk.words.some(w => t.includes(" " + norm(w).trim() + " "))) found.add(id);
    return found;
  }
  async function readFile(file) {
    const name = file.name.toLowerCase();
    if (name.endsWith(".pdf")) {
      const pdfjs = await import("./lib/pdf.min.mjs");
      pdfjs.GlobalWorkerOptions.workerSrc = new URL("./lib/pdf.worker.min.mjs", location.href).href;
      const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      let out = "";
      for (let i = 1; i <= Math.min(doc.numPages, 10); i++)
        out += (await (await doc.getPage(i)).getTextContent()).items.map(x => x.str).join(" ") + "\n";
      return out;
    }
    if (name.endsWith(".docx")) {
      await new Promise((ok, bad) => { if (window.JSZip) return ok(); const s = document.createElement("script"); s.src = "lib/jszip.min.js"; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const xml = await zip.file("word/document.xml").async("string");
      return xml.replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
    }
    if (name.endsWith(".txt") || file.type.startsWith("text/")) return await file.text();
    if (name.endsWith(".doc")) throw new Error("Old Word files (.doc) can't be read here. Save it as .docx or PDF, or paste the text below.");
    throw new Error("Please use a PDF, Word (.docx) or text file – or paste your CV text below.");
  }

  // ---------------------------------------------------------------- matching
  function score(sector, skills) {
    const w = Object.entries(sector.skills), total = w.reduce((a, [, v]) => a + v, 0);
    const got = w.filter(([k]) => skills.has(k)).reduce((a, [, v]) => a + v, 0);
    return total ? got / total : 0;
  }

                <label><b>Search</b><br><input id="fq" type="search" value="${esc(q0)}" placeholder="Job, company or town" style="width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;margin-top:4px"></label>
        <label><b>Sector</b><br><select id="fs" style="width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;margin-top:4px">
          <option value="">All sectors</option>${[...P.SECTORS].sort((a, b) => a.name.localeCompare(b.name)).map(x => `<option value="${x.id}" ${x.id === sel ? "selected" : ""}>${esc(x.name)}</option>`).join("")}<option value="other" ${sel === "other" ? "selected" : ""}>Other jobs (no sector)</option></select></label>
        <label><b>Town</b><br><select id="ft" style="width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;margin-top:4px"><option value="">Anywhere</option></select></label>
        <label><b>Sort by</b><br><select id="fo" style="width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;margin-top:4px">
          <option value="close">Closing soonest</option><option value="payhi">Highest pay</option><option value="paylo">Lowest pay</option><option value="az">A–Z</option></select></label>
        <div class="lvl"><b>Show</b><div class="chips" id="fl">${[["all", "All"], ["entry", "Entry level"], ["exp", "Experienced"]].map(([v, t]) => `<button class="chip" data-v="${v}" aria-pressed="${v === lvl}">${t}</button>`).join("")}</div></div>
      </div>
      <p class="status" id="cnt"></p><div id="all" class="livejobs"><p class="muted">Loading…</p></div>`;
    const { jobs, careers } = await loadBoard();
    const rows = [...jobs.map(j => ({ ...j, entry: true })), ...careers.map(j => ({ ...j, entry: !!j.entry }))];
    let shown = 60;
    const towns = [...new Set(rows.map(j => j.town).filter(Boolean))].sort();
    document.getElementById("ft").innerHTML += towns.map(t => `<option>${esc(t)}</option>`).join("");
    const draw = () => {
      const fs = document.getElementById("fs").value, fq = document.getElementById("fq").value.trim().toLowerCase();
      const ft = document.getElementById("ft").value, fo = document.getElementById("fo").value;
      const words = fq.split(/\s+/).filter(Boolean);
      const fl = app.querySelector('#fl [aria-pressed="true"]').dataset.v;
      const sec = S(fs);
      const list = rows.filter(j => (fs === "other" ? !sectorsOf(j).length : !sec || inSector(sec, j)) &&
        (fl === "all" || (fl === "entry") === j.entry) && (!ft || j.town === ft) &&
        words.every(w => `${j.title} ${j.employer} ${j.town} ${j.level || "entry level"}`.toLowerCase().includes(w)))
        .sort(fo === "payhi" ? (a, b) => yearly(b.pay) - yearly(a.pay) : fo === "paylo" ? (a, b) => (yearly(a.pay) || 1e9) - (yearly(b.pay) || 1e9)
          : fo === "az" ? (a, b) => a.title.localeCompare(b.title) : (a, b) => (a.closing || "9999").localeCompare(b.closing || "9999"));
      const ne = list.filter(j => j.entry).length;
      document.getElementById("cnt").textContent = `${list.length} job${list.length === 1 ? "" : "s"} · ${ne} entry level · ${list.length - ne} experienced`;
      if (!list.length) { document.getElementById("all").innerHTML = `<p class="muted">No jobs match. Try fewer words, another town, or "All sectors".</p>`; return; }
      document.getElementById("all").innerHTML = list.slice(0, shown).map(j => j.entry && !j.nodate
        ? jobLink(j).replace("</b>", ` <span class="badge" style="background:#e6f4ea;color:#0b4f2a">ENTRY LEVEL</span></b>`) : careerLink(j)).join("") +
        (list.length > shown ? `<div class="row" style="justify-content:center;margin-top:12px"><button class="btn alt small" id="more">Show more</button></div>` : "");
      const m = document.getElementById("more"); if (m) m.onclick = () => { shown += 60; draw(); };
    };
    document.getElementById("fs").onchange = () => { shown = 60; draw(); };
    document.getElementById("fq").oninput = () => { shown = 60; draw(); };
    document.getElementById("ft").onchange = document.getElementById("fo").onchange = () => { shown = 60; draw(); };
    document.getElementById("fl").onclick = e => { const b = e.target.closest(".chip"); if (!b) return;
      app.querySelectorAll("#fl .chip").forEach(c => c.setAttribute("aria-pressed", c === b)); shown = 60; draw(); };
    draw();
  }

  function fullGuide(s) {
    return `<section id="about"><h2>What is it like?</h2><p>${esc(s.about)}</p>
      <div class="facts">
        <div class="fact"><h3><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span>What to expect</h3><ul>${s.expect.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="fact"><h3><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>Jobs to start in</h3><ul>${s.roles.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="fact"><h3><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>Experience needed</h3><p>${esc(s.needs.experience)}</p></div>
        <div class="fact"><h3><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7.5 21l4.5-2.5 4.5 2.5-1-7.5"/></svg></span>Qualifications & licences</h3><p>${esc(s.needs.quals)}</p></div>
      </div></section>
      <section id="steps"><h2>Your pathway, step by step</h2>
      <ol class="steps">${s.steps.map(x => `<li><b>${esc(x.t)}</b>${esc(x.d)}</li>`).join("")}</ol></section>`;
  }

  // ---------------------------------------------------------------- router (#cv, #tick, #results?s=a,b, #sector/id?s=a,b)
  function route() {
    const [path, query] = location.hash.slice(1).split("?");
    const s = new URLSearchParams(query || "").get("s");
    if (s !== null) mine = new Set(s.split(",").filter(k => P.SKILLS[k]));
    const [view, arg] = path.split("/");
    loadBoard();
    if (view === "cv") cvView();
    else if (view === "tick") tickView();
    else if (view === "results") resultsView();
    else if (view === "sector") sectorView(arg);
    else if (view === "sectors") sectorsView();
    else if (view === "alljobs") allJobsView(new URLSearchParams(query || ""));
    else home();
    if (view !== "sector") window.scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
